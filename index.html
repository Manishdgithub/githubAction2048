
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <div>
        <h1>2048</h1>
        <p>Join the tiles. Reach 2048!</p>
      </div>
      <div class="score-box">
        <span>SCORE</span>
        <strong id="score">0</strong>
      </div>
    </header>

    <div class="toolbar">
      <span id="status">Use arrow keys to play</span>
      <button id="restart">New Game</button>
    </div>

    <div id="board" class="board" aria-label="2048 game board"></div>
    <p class="help">Use ← ↑ → ↓ or swipe on mobile.</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
