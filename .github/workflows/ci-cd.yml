
name: 2048 Game CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 2048-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}

jobs:
  security:
    name: Secret and Dependency Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v2

      - name: Scan repository dependencies and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  lint:
    name: Lint and Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint HTML, CSS, JavaScript and Dockerfile
        uses: super-linter/super-linter/slim@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_HTML: true
          VALIDATE_CSS: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_DOCKERFILE_HADOLINT: true

  build-and-test:
    name: Build and Smoke Test
    runs-on: ubuntu-latest
    needs: [security, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${GITHUB_SHA::12} \
            -t $IMAGE_NAME:latest .

      - name: Verify image was created
        run: docker image inspect "$IMAGE_NAME:${GITHUB_SHA::12}"

      - name: Start application container
        run: |
          docker run -d \
            --name game-test \
            -p 127.0.0.1:8080:80 \
            "$IMAGE_NAME:${GITHUB_SHA::12}"

      - name: Smoke test application
        run: |
          for i in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8080/ \
              -o response.html; then
              break
            fi
            sleep 2
          done

          test -s response.html
          grep -qi '<html' response.html
          grep -q 'game.js' response.html
          grep -q 'style.css' response.html

      - name: Show container logs on failure
        if: failure()
        run: docker logs game-test || true

      - name: Cleanup test container
        if: always()
        run: docker rm -f game-test || true

  image-scan:
    name: Container Image Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image for scanning
        run: |
          docker build \
            -t $IMAGE_NAME:${GITHUB_SHA::12} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: manishdhaipulle/my-2048-game:${{ github.sha }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Push Image to Docker Hub
    runs-on: ubuntu-latest
    needs: image-scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push verified image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
